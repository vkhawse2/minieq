name: Build (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      efx_slot:
        description: 'Route 1 experiment: build EFX-slot test binaries (EQ should survive spatial sound)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake, x64, VS2022)
        run: |
          # Stamp the short commit SHA into both binaries so the UI can tell
          # whether the audio engine is running a stale APO DLL.
          $sha = $env:GITHUB_SHA.Substring(0, 8)
          $efx = 'OFF'
          if ('${{ inputs.efx_slot }}' -eq 'true') { $efx = 'ON' }
          cmake -S . -B build -A x64 "-DMINIEQ_BUILD_ID=$sha" "-DMINIEQ_EFX_SLOT=$efx"

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Stage binaries
        run: |
          mkdir build\stage
          copy build\app\Release\MiniEQ.exe build\stage\
          copy build\apo\Release\MiniEQ_APO.dll build\stage\

      # WiX v3 ships preinstalled on windows-latest; this is a no-op then.
      - name: Install WiX Toolset v3
        run: choco install wixtoolset -y --no-progress

      - name: Build MSI installer
        run: |
          $wixBin = Join-Path ([System.Environment]::GetEnvironmentVariable("WIX", "Machine")) "bin"
          & "$wixBin\candle.exe" -arch x64 "-dBinDir=build\stage" installer\MiniEQ.wxs -out build\MiniEQ.wixobj
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$wixBin\light.exe" build\MiniEQ.wixobj -out build\stage\MiniEQ-0.2.3-x64.msi
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minieq-windows-x64-0.2.3${{ inputs.efx_slot && '-efx-test' || '' }}
          path: |
            build\stage\MiniEQ.exe
            build\stage\MiniEQ_APO.dll
            build\stage\MiniEQ-0.2.3-x64.msi
          if-no-files-found: error
